name: Create Release

on:
  push:
    tags:
      - 'v*' # Trigger on version tags

permissions:
  contents: write

jobs:
  create_release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "gfastats ${GITHUB_REF_NAME}" \
            --generate-notes

  add_resources:
    needs: create_release
    name: Add Resources
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            os_name: macOS
          - os: ubuntu-latest
            os_name: linux
          - os: windows-latest
            os_name: win
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Build
        run: make -j
      - name: Package and upload binary (Linux & macOS)
        if: matrix.os_name != 'win'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x build/bin/gfastats
          ASSET="gfastats.${GITHUB_REF_NAME}-${{ matrix.os_name }}.tar.gz"
          tar -czvf "${ASSET}" -C build/bin gfastats
          gh release upload "${GITHUB_REF_NAME}" "${ASSET}" --clobber
      - name: Package and upload binary (Windows)
        if: matrix.os_name == 'win'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $asset = "gfastats.$($env:GITHUB_REF_NAME)-${{ matrix.os_name }}.zip"
          Compress-Archive -Path "build/bin/gfastats.exe" -DestinationPath $asset -Force
          gh release upload $env:GITHUB_REF_NAME $asset --clobber

  add_submodules:
    needs: create_release
    name: Source with submodules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Package and upload source archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSET="gfastats.${GITHUB_REF_NAME}-with_submodules.zip"
          zip -r "${ASSET}" . -x '*.git*'
          gh release upload "${GITHUB_REF_NAME}" "${ASSET}" --clobber
