name: Validate

on:
  push:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            command: ".github/workflows/val.sh"
          - os: ubuntu-latest
            command: ".github/workflows/val.sh"
            chmod: true
          - os: windows-latest
            command: ".github/workflows/val.bat"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Build
        run: make all -j
      - name: Make validation script executable
        if: matrix.os != 'windows-latest'
        run: chmod +x .github/workflows/val.sh
      - name: Validate
        run: ${{ matrix.command }}
